
name: Build ASAMurderMystery

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source ZIP
        run: |
          mkdir source
          unzip -q ASAMurderMystery-Source.zip -d source

      - name: Build with Maven
        run: |
          POM=$(find source -name pom.xml -print -quit)
          if [ -z "$POM" ]; then
            echo "pom.xml tidak ditemukan!"
            exit 1
          fi
          cd "$(dirname "$POM")"
          mvn clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ASAMurderMystery-JAR
          path: source/**/target/*.jar
          
